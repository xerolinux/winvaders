[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "winvaders"
version = "1.3.1"
description = "Arcade shooter: defend Linux from invading Microsoft apps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "XeroLinux Team" }]
dependencies = ["PySide6>=6.6"]

[project.scripts]
winvaders = "winvaders.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/winvaders"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
