name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SDL_TAG: release-3.4.20

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check tag matches version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != pyproject $version"; exit 1; }
          python packaging/release_notes.py "$version" > notes.md
          cat notes.md

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libudev-dev \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libpulse0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-util1 libxkbcommon-x11-0

      - name: Build SDL3
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git sdl
          # Only the gamepad subsystem is used; Qt owns video and audio.
          cmake -S sdl -B build-sdl -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_VIDEO=OFF -DSDL_RENDER=OFF -DSDL_GPU=OFF -DSDL_AUDIO=OFF -DSDL_CAMERA=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build build-sdl

      - name: Build AppImage
        run: packaging/appimage/build.sh build-sdl/libSDL3.so.0 dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/WinVaders-x86_64.AppImage dist/WinVaders-x86_64.AppImage.sha256 \
            --title "WinVaders ${GITHUB_REF_NAME#v}" --notes-file notes.md
